name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & test (in container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: militech-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ruff + pytest inside the container
        run: docker run --rm militech-mcp:ci test -v
